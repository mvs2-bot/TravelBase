<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TravelBase</title>
<!-- Alter Reise-Ordner: alle Reisen laufen über ../reise/?r=<Kennung>. Diese Datei leitet nur weiter (Ordnername = Kennung). -->
<script>
(function () {
    var p = location.pathname.replace(/index\.html$/, '').split('/').filter(Boolean), slug = p[p.length - 1];
    var q = location.search ? '&' + location.search.slice(1) : '';
    location.replace('../reise/?r=' + encodeURIComponent(slug) + q + location.hash);
})();
</script>
</head>
<body style="font-family:-apple-system,system-ui,sans-serif;padding:24px"><a href="../">TravelBase öffnen</a></body>
</html>
